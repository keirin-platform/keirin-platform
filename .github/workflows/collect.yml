# Reusable workflow: collects race data into the CALLER's repository.
#
# It is meant to be called from the private data repository (see
# infra/data-repo/), so that collected data and job logs never live in this
# public repository. Commits are created through the GitHub API with the
# caller's GITHUB_TOKEN and are therefore signed ("Verified") by GitHub.
name: collect

on:
  workflow_call:
    inputs:
      date:
        description: >-
          First day to collect (YYYY-MM-DD). Empty = rolling window of the last 4 months
          (JST), fetching at most max_days missing days per run (default 10).
        type: string
        default: ""
      to:
        description: Last day to collect (inclusive). Empty = same as date.
        type: string
        default: ""
      max_days:
        description: Fetch at most N missing days in this run (newest first). Empty = no limit.
        type: string
        default: ""
      code_ref:
        description: Ref of keirin-platform to run.
        type: string
        default: main

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout data repository (caller)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: data
          persist-credentials: false

      - name: Checkout keirin-platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: keirin-platform/keirin-platform
          ref: ${{ inputs.code_ref }}
          path: code
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Collect
        id: collect
        working-directory: code
        env:
          DATE: ${{ inputs.date }}
          TO: ${{ inputs.to }}
          MAX_DAYS: ${{ inputs.max_days }}
        run: |
          if [ -z "$DATE" ]; then
            # Keep the last 4 months complete; a backfill is spread over several daily runs.
            DATE=$(TZ=Asia/Tokyo date -d '4 months ago' +%F)
            TO=$(TZ=Asia/Tokyo date -d 'yesterday' +%F)
            MAX_DAYS=${MAX_DAYS:-10}
          fi
          args=(--data-dir ../data --date "$DATE" --to "${TO:-$DATE}")
          if [ -n "$MAX_DAYS" ]; then
            args+=(--max-days "$MAX_DAYS")
          fi
          uv run --locked --no-dev keirin collect "${args[@]}"

      # Runs even if collection failed part-way, so days already fetched are kept.
      - name: Commit (signed by GitHub)
        if: ${{ !cancelled() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        working-directory: code
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          mapfile -t days < <(git -C ../data status --porcelain --untracked-files=all -- raw \
            | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u)
          if [ "${#days[@]}" -eq 0 ]; then
            echo "no new data"
            exit 0
          elif [ "${#days[@]}" -eq 1 ]; then
            message="chore(data): collect ${days[0]}"
          else
            message="chore(data): collect ${#days[@]} days (${days[0]}..${days[-1]})"
          fi
          uv run --locked --no-dev keirin github-commit --repo-dir ../data \
            --repo "$REPO" --branch "$BRANCH" --message "$message"

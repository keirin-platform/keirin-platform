# Reusable workflow: collects race data into the CALLER's repository.
#
# It is meant to be called from the private data repository (see
# infra/data-repo/), so that collected data and job logs never live in this
# public repository. Commits are created through the GitHub API with the
# caller's GITHUB_TOKEN and are therefore signed ("Verified") by GitHub.
name: collect

on:
  workflow_call:
    inputs:
      date:
        description: >-
          First day to collect (YYYY-MM-DD). Empty = rolling window from the 1st of the month
          4 months ago (JST), fetching at most max_days missing days per run (default 15).
        type: string
        default: ""
      to:
        description: Last day to collect (inclusive). Empty = same as date.
        type: string
        default: ""
      max_days:
        description: Fetch at most N missing days in this run (newest first). Empty = no limit.
        type: string
        default: ""
      since:
        description: >-
          First day of the rolling window (YYYY-MM-DD) when date is empty. Empty = the 1st of
          the month 4 months ago. Days before it that are already collected are kept anyway.
        type: string
        default: ""
      lines_only:
        description: Only capture upcoming line formations from keirin.jp (evening run).
        type: boolean
        default: false
      discord_test:
        description: Only send a test notification to DISCORD_WEBHOOK_URL.
        type: boolean
        default: false
      code_ref:
        description: Ref of keirin-platform to run.
        type: string
        default: main
    secrets:
      DISCORD_WEBHOOK_URL:
        description: Discord webhook for watchlist notifications (docs/notifications.md).
        required: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout data repository (caller)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: data
          persist-credentials: false

      - name: Checkout keirin-platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: keirin-platform/keirin-platform
          ref: ${{ inputs.code_ref }}
          path: code
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Collect
        id: collect
        if: ${{ !inputs.lines_only && !inputs.discord_test }}
        working-directory: code
        env:
          DATE: ${{ inputs.date }}
          TO: ${{ inputs.to }}
          MAX_DAYS: ${{ inputs.max_days }}
          SINCE: ${{ inputs.since }}
        run: |
          # Keep everything since the 1st of the month 4 months ago (the score window is the
          # current month + 3 previous; one more month allows evaluating last month's cards).
          SINCE=${SINCE:-$(TZ=Asia/Tokyo date -d "$(TZ=Asia/Tokyo date +%Y-%m-01) -4 months" +%F)}
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
          if [ -z "$DATE" ]; then
            # A backfill is spread over several daily runs by MAX_DAYS.
            DATE=$SINCE
            TO=$(TZ=Asia/Tokyo date -d 'yesterday' +%F)
            MAX_DAYS=${MAX_DAYS:-15}
          fi
          args=(--data-dir ../data --date "$DATE" --to "${TO:-$DATE}")
          if [ -n "$MAX_DAYS" ]; then
            args+=(--max-days "$MAX_DAYS")
          fi
          uv run --locked --no-dev keirin collect "${args[@]}"

      # Line formations (docs/lines.md). keirin.jp shows them only until the race is over,
      # so capture today's and tomorrow's on every run.
      # The same requests also feed the watchlist notifications (docs/notifications.md).
      - name: Capture upcoming lines (keirin.jp) and notify
        id: lines
        if: ${{ !cancelled() && !inputs.discord_test }}
        working-directory: code
        env:
          DAYS: ${{ inputs.lines_only && '1' || '2' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          uv run --locked --no-dev keirin collect-lines --data-dir ../data --days "$DAYS" \
            --watchlist ../data/watchlist.toml

      # Past and missed formations from Oddspark: 10 s between pages (robots.txt), at most
      # 50 minutes per run. Waits until the main collection has no missing days.
      - name: Backfill lines (Oddspark)
        id: backfill_lines
        if: ${{ !cancelled() && !inputs.lines_only && !inputs.discord_test && steps.collect.outputs.since != '' }}
        working-directory: code
        env:
          SINCE: ${{ steps.collect.outputs.since }}
        run: |
          uv run --locked --no-dev keirin backfill-lines --data-dir ../data \
            --since "$SINCE" --budget-minutes 50

      - name: Discord test
        if: ${{ inputs.discord_test }}
        working-directory: code
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: uv run --locked --no-dev keirin discord-test

      # Runs even if a step failed part-way, so what was fetched is kept.
      - name: Commit (signed by GitHub)
        if: ${{ !cancelled() }}
        working-directory: code
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          changed=$(git -C ../data status --porcelain --untracked-files=all -- raw)
          mapfile -t days < <(grep -E ' raw/[0-9]{4}/' <<<"$changed" \
            | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u)
          mapfile -t line_days < <(grep -E ' raw/lines/' <<<"$changed" \
            | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u)
          parts=()
          if [ "${#days[@]}" -eq 1 ]; then
            parts+=("collect ${days[0]}")
          elif [ "${#days[@]}" -gt 1 ]; then
            parts+=("collect ${#days[@]} days (${days[0]}..${days[-1]})")
          fi
          if [ "${#line_days[@]}" -eq 1 ]; then
            parts+=("lines ${line_days[0]}")
          elif [ "${#line_days[@]}" -gt 1 ]; then
            parts+=("lines ${#line_days[@]} days (${line_days[0]}..${line_days[-1]})")
          fi
          if [ -n "$(git -C ../data status --porcelain -- notify)" ]; then
            parts+=("notifications")
          fi
          if [ "${#parts[@]}" -eq 0 ]; then
            echo "no new data"
            exit 0
          fi
          message="chore(data): $(IFS=';'; echo "${parts[*]}" | sed 's/;/, /g')"
          uv run --locked --no-dev keirin github-commit --repo-dir ../data \
            --repo "$REPO" --branch "$BRANCH" --message "$message"

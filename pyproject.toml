[project]
name = "keirin"
version = "0.1.0"
description = "Personal keirin data platform (collector for the KEIRIN.JP JSON API)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
keirin = "keirin.cli:main"

[project.optional-dependencies]
app = [
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

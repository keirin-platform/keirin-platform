# Caller workflow for the private data repository (keirin-platform/keirin-data).
# The logic lives in keirin-platform's reusable workflow; keep this file thin.
name: collect

on:
  schedule:
    # 03:30 JST, after midnight races are settled. Each run keeps everything since
    # `since` complete, fetching at most 15 missing days (newest first).
    - cron: "30 18 * * *"
    # 16:00 JST: line formations only, for meetings that publish them late (night / midnight).
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "First day (YYYY-MM-DD). Empty = rolling 4-month window (JST)"
        required: false
        default: ""
      to:
        description: "Last day (inclusive). Empty = same as date"
        required: false
        default: ""
      max_days:
        description: "Fetch at most N missing days (newest first). Empty = 15 for the window, no limit for an explicit range"
        required: false
        default: ""
      since:
        description: "First day of the rolling window. Empty = 2025-12-01"
        required: false
        default: ""
      lines_only:
        description: "Only capture upcoming line formations"
        type: boolean
        required: false
        default: false
      discord_test:
        description: "Only send a test notification to Discord"
        type: boolean
        required: false
        default: false
      code_ref:
        description: "keirin-platform ref to run"
        required: false
        default: main

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    permissions:
      contents: write
    uses: keirin-platform/keirin-platform/.github/workflows/collect.yml@main
    with:
      date: ${{ inputs.date || '' }}
      to: ${{ inputs.to || '' }}
      max_days: ${{ inputs.max_days || '' }}
      # Keep everything since 2025-12-01 (covers the 2026-01 and 2026-07 class changes
      # for the race score analysis); filled 15 days per run, newest first.
      since: ${{ inputs.since || '2025-12-01' }}
      lines_only: ${{ github.event.schedule == '0 7 * * *' || inputs.lines_only == true }}
      discord_test: ${{ inputs.discord_test == true }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      code_ref: ${{ inputs.code_ref || 'main' }}

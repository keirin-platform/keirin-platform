# Render Blueprint for the race card viewer. Lives in the PRIVATE data repository:
# Render deploys this repository (the collected tables) and fetches the viewer code
# from the public keirin-platform repository at build time. Every data commit
# therefore redeploys the viewer with fresh data, and no secret is needed to read
# the private data. Personal use only: protected by HTTP Basic auth.
services:
  - type: web
    name: keirin-viewer
    runtime: python
    plan: free
    region: singapore
    buildCommand: >-
      rm -rf .code &&
      git clone --quiet --depth 1 https://github.com/keirin-platform/keirin-platform.git .code &&
      pip install --quiet uv &&
      uv sync --project .code --locked --no-dev --extra web
    startCommand: >-
      KEIRIN_DATA_DIR=. uv run --project .code --no-sync
      uvicorn --factory keirin.web.app:create_app_from_env --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: UV_PYTHON_DOWNLOADS
        value: never
      - key: KEIRIN_WEB_USER
        value: keirin
      - key: KEIRIN_WEB_PASSWORD
        generateValue: true
